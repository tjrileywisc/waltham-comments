name: waltham-comments
include:
  - env_file: .env

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  embeddings-service:
    build:
      context: .
      dockerfile: embeddings-service/Dockerfile
    image: embeddings-service
    environment:
      HF_TOKEN: ${HF_TOKEN}
    ports:
      - 8001
    volumes:
      - C:/workspace/waltham-comments/models:/app/models
  ollama:
    image: ollama/ollama
    volumes:
      - C:/workspace/waltham-comments/models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  meeting-downloader:
    build:
      context: .
      dockerfile: meeting-downloader/Dockerfile
    image: meeting-downloader
    volumes:
      - C:/workspace/waltham-comments/videos:/app/videos
      - C:/workspace/waltham-comments/audio:/app/audio
  transcription-service:
    build:
      context: .
      dockerfile: transcription-service/Dockerfile
    image: transcription-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EMBEDDINGS_SERVICE_URL: http://embeddings-service:8001
      HF_TOKEN: ${HF_TOKEN}
    depends_on:
      postgres:
        condition: service_started
      embeddings-service:
        condition: service_started
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - C:/workspace/waltham-comments/audio:/app/audio
      - C:/workspace/waltham-comments/data:/app/data
      - C:/workspace/waltham-comments/models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  web:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: comments-web
    environment:
      DATA_DIR: ${DATA_DIR}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EMBEDDINGS_SERVICE_URL: http://embeddings-service:8001
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:14b
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - ollama
    volumes:
      - C:/workspace/waltham-comments/videos:/app/videos
      - C:/workspace/waltham-comments/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
